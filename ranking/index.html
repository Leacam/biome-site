<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIOME — Ranking Semanal</title>
<meta name="description" content="Ranking semanal do BIOME: os maiores evolucionistas de cada era — da Sopa Primordial ao Multiverso.">
<meta property="og:title" content="BIOME — Ranking Semanal">
<meta property="og:description" content="Quem está no topo desta semana? Do micróbio ao cosmos.">
<meta property="og:image" content="https://leacam.github.io/biome-site/ranking/img/podium.webp">
<meta name="theme-color" content="#0b1d2a">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4fbff; --ink-dim:#a9c4cf; --panel:rgba(10,30,44,.82); --panel-2:rgba(16,44,62,.9);
    --line:#43e6a2; --line-soft:rgba(67,230,162,.35); --pill:#1d4a63; --pill-2:#2a6382;
    --gold:#ffcf3a; --gold-deep:#c98a10; --silver:#d9e2ea; --bronze:#e08a4a;
    --accent:#43e6a2; --accent-2:#1fb6c9;
  }
  body[data-era="1"]{ --accent:#3fd4ff; --accent-2:#1f7fc9; --line:#3fd4ff; --line-soft:rgba(63,212,255,.35); }
  body[data-era="2"]{ --accent:#7be35a; --accent-2:#2f9e46; --line:#7be35a; --line-soft:rgba(123,227,90,.35); }
  body[data-era="3"]{ --accent:#ffc04a; --accent-2:#d9792b; --line:#ffc04a; --line-soft:rgba(255,192,74,.35); }
  body[data-era="4"]{ --accent:#b98cff; --accent-2:#6a46d9; --line:#b98cff; --line-soft:rgba(185,140,255,.38); }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:#071520; color:var(--ink);
    font-family:"Nunito",system-ui,sans-serif; font-weight:800;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .bg{position:fixed;inset:0;z-index:-2;background:#071520 center/cover no-repeat;transition:background-image .6s ease, opacity .6s;}
  .bg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 0%, rgba(7,21,32,.15), rgba(7,21,32,.78) 60%, rgba(7,21,32,.95));}
  .motes{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .motes i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;
    background:var(--accent);opacity:.0;filter:blur(.5px);box-shadow:0 0 10px var(--accent);
    animation:rise linear infinite;}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.7}100%{transform:translateY(-110vh) scale(1.1);opacity:0}}

  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
  header{text-align:center;padding-top:6px}
  .logo{width:min(220px,52vw);filter:drop-shadow(0 8px 22px rgba(0,0,0,.55));animation:bob 5s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
  .lang{position:absolute;top:14px;right:16px;display:flex;gap:6px;z-index:10}
  .lang button{font:inherit;font-size:12px;color:var(--ink-dim);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);
    border-radius:999px;padding:5px 9px;cursor:pointer}
  .lang button.on{color:#06202c;background:var(--accent);border-color:transparent}

  .panel{
    position:relative;margin-top:10px;background:var(--panel);
    border:3px solid var(--line);border-radius:34px;padding:22px 18px 22px;
    box-shadow:0 0 0 2px rgba(0,0,0,.45) inset, 0 0 28px var(--line-soft), 0 18px 50px rgba(0,0,0,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:border-color .4s, box-shadow .4s;
  }
  h1{font-family:"Lilita One",sans-serif;font-weight:400;text-align:center;margin:0;font-size:clamp(30px,8vw,44px);letter-spacing:.5px;
    text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 18px rgba(255,255,255,.15)}
  .sub{text-align:center;color:var(--ink-dim);font-size:14px;margin-top:4px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
  .sub b{color:var(--ink)}
  .clock{display:inline-flex;align-items:center;gap:6px}
  .clock::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* Lentes das eras — como o seletor de eras do jogo */
  .lenses{display:flex;justify-content:center;gap:clamp(10px,4vw,26px);margin:22px 0 6px}
  .lens{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;width:clamp(64px,18vw,92px);-webkit-tap-highlight-color:transparent}
  .lens .ring{position:relative;width:100%;aspect-ratio:1;border-radius:50%;padding:4px;
    background:conic-gradient(from 210deg,#fff3b0,var(--gold),var(--gold-deep),#fff3b0,var(--gold),var(--gold-deep),#fff3b0);
    box-shadow:0 6px 14px rgba(0,0,0,.5);transition:transform .25s, box-shadow .25s, filter .25s;filter:saturate(.55) brightness(.75)}
  .lens img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;background:#0a2230}
  .lens .num{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-family:"Lilita One";font-size:15px;color:#3a2600;background:radial-gradient(circle at 35% 30%,#fff6c4,var(--gold) 55%,var(--gold-deep));
    border:2px solid #3a2600}
  .lens span{font-size:12px;color:var(--ink-dim);text-align:center;line-height:1.1}
  .lens.on .ring{transform:translateY(-4px) scale(1.07);filter:none;box-shadow:0 0 0 3px rgba(255,255,255,.08),0 0 26px var(--accent),0 10px 18px rgba(0,0,0,.5)}
  .lens.on span{color:var(--ink)}
  .lens .count{font-size:11px;color:var(--accent);min-height:13px;white-space:nowrap}

  /* Categorias — pílulas como no jogo */
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px;margin:18px 0 6px}
  .cat{all:unset;cursor:pointer;text-align:center;padding:9px 10px;border-radius:999px;font-size:clamp(13px,3.6vw,16px);
    color:#e6f3f8;background:linear-gradient(180deg,var(--pill-2),var(--pill));
    box-shadow:0 0 0 2px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.12) inset,0 -3px 0 rgba(0,0,0,.25) inset;
    text-shadow:0 1px 0 rgba(0,0,0,.6);transition:transform .15s, background .2s;-webkit-tap-highlight-color:transparent}
  .cat:active{transform:scale(.97)}
  .cat.on{color:#fff;background:linear-gradient(180deg,var(--accent),var(--accent-2));
    box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 16px var(--line-soft),0 2px 0 rgba(255,255,255,.35) inset,0 -3px 0 rgba(0,0,0,.2) inset;
    text-shadow:0 1px 1px rgba(0,0,0,.55)}
  .cat.lone{grid-column:1 / -1}

  /* Pódio */
  .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:84px 0 14px;min-height:10px}
  .pod{position:relative;text-align:center;border-radius:22px;padding:46px 8px 14px;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
    border:2px solid rgba(255,255,255,.12);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .pod.p1{padding-top:58px;border-color:rgba(255,207,58,.6);background:linear-gradient(180deg,rgba(255,207,58,.22),rgba(255,207,58,.04));
    box-shadow:0 0 26px rgba(255,207,58,.25)}
  .pod.p2{border-color:rgba(217,226,234,.45);animation-delay:.08s}
  .pod.p3{border-color:rgba(224,138,74,.5);animation-delay:.16s}
  .pod img.medal{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:68px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
  .pod.p1 img.medal{width:84px;top:-44px}
  .pod .crown{position:absolute;left:50%;top:-74px;transform:translateX(-50%);font-size:28px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
  .pod .nm{font-size:clamp(12px,3.4vw,15px);overflow-wrap:anywhere;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center}
  .pod .sc{font-family:"Lilita One";font-size:clamp(18px,5vw,26px);margin-top:6px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  .pod.p1 .sc{color:var(--gold)}
  .pod .rk{font-size:11px;color:var(--ink-dim);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
  @keyframes pop{from{transform:translateY(16px) scale(.92);opacity:0}}

  /* Lista */
  .list{display:flex;flex-direction:column;gap:8px;margin-top:6px;
    border:3px solid var(--line-soft);border-radius:24px;padding:10px;background:rgba(4,16,24,.55)}
  .row{display:grid;grid-template-columns:30px 36px 1fr auto;align-items:center;gap:9px;padding:9px 10px;border-radius:16px;
    background:rgba(255,255,255,.05);animation:slide .35s ease both}
  .row:nth-child(odd){background:rgba(255,255,255,.08)}
  @keyframes slide{from{transform:translateX(-10px);opacity:0}}
  .row .pos{font-family:"Lilita One";font-size:18px;color:var(--ink-dim);text-align:center}
  .row .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:"Lilita One";font-size:18px;color:#fff;
    text-shadow:0 1px 1px rgba(0,0,0,.6);box-shadow:0 0 0 2px rgba(0,0,0,.4),0 2px 0 rgba(255,255,255,.25) inset}
  .row .nm{font-size:14px;line-height:1.15;overflow-wrap:anywhere}
  .row .sc{white-space:nowrap}
  .row .sc{font-family:"Lilita One";font-size:18px;letter-spacing:.3px}

  .empty{text-align:center;padding:26px 10px 8px}
  .empty img{width:120px;opacity:.95;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:bob 4s ease-in-out infinite}
  .empty h3{font-family:"Lilita One";font-weight:400;font-size:24px;margin:12px 0 6px}
  .empty p{color:var(--ink-dim);margin:0 auto;max-width:380px;line-height:1.4}

  .cta{display:flex;justify-content:center;margin-top:22px}
  .cta a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#06202c;font-size:17px;padding:13px 24px;border-radius:999px;
    background:linear-gradient(180deg,#8ff5c4,#43e6a2 55%,#22b97a);box-shadow:0 0 0 3px rgba(0,0,0,.45),0 0 22px rgba(67,230,162,.45),0 3px 0 rgba(255,255,255,.5) inset;
    transition:transform .15s}
  .cta a:hover{transform:translateY(-2px)}
  .cta svg{width:22px;height:22px}
  footer{text-align:center;color:var(--ink-dim);font-size:12px;margin-top:22px;line-height:1.7}
  footer a{color:var(--ink-dim)}
  .skeleton{height:52px;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .sub{align-items:center}
  .refresh{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#06202c;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 12px var(--line-soft);
    -webkit-tap-highlight-color:transparent;transition:transform .15s}
  .refresh:active{transform:scale(.9)}
  .refresh svg{width:18px;height:18px}
  .refresh.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Esta semana / Semana passada */
  .weeks{display:flex;justify-content:center;gap:8px;margin:14px 0 0}
  .weeks button{all:unset;cursor:pointer;font-size:13px;padding:6px 14px;border-radius:999px;color:var(--ink-dim);
    background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);-webkit-tap-highlight-color:transparent}
  .weeks button.on{color:#06202c;background:var(--accent);border-color:transparent}
  .final{display:inline-flex;align-items:center;gap:6px}
  .final::before{content:"🏁"}

  /* Modo print (?shot=1): só o pódio da era, para virar imagem de post */
  body.shot .lang, body.shot header, body.shot .weeks, body.shot .cats, body.shot .cta, body.shot footer,
  body.shot .refresh, body.shot .motes{display:none}
  body.shot .wrap{padding:16px 16px}
  body.shot .panel{margin-top:0}
  body.shot .lenses{margin-top:18px}
  body.shot .podium{margin-top:78px}
  body.shot .list .row:nth-child(n+3){display:none}
  body.shot *{animation:none!important;transition:none!important}
  body.quiet .pod, body.quiet .row{animation:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-era="1">
<div class="bg" id="bg"></div>
<div class="motes" id="motes"></div>
<div class="lang" id="lang"></div>

<div class="wrap">
  <header><img class="logo" src="img/logo.webp" alt="BIOME"></header>

  <main class="panel">
    <h1 id="title">Ranking Semanal</h1>
    <div class="sub">
      <span class="clock" id="clock">—</span>
      <span id="updated"></span>
      <button class="refresh" id="refresh" aria-label="Atualizar"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></button>
    </div>

    <nav class="weeks" id="weeks"></nav>
    <nav class="lenses" id="lenses"></nav>
    <div class="cats" id="cats"></div>

    <section id="board">
      <div class="skeleton"></div>
    </section>

    <div class="cta"><a id="play" href="https://play.google.com/store/apps/details?id=com.leacam.games.biome" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#06202c" d="M4.2 2.5c-.3.3-.5.8-.5 1.4v16.2c0 .6.2 1.1.5 1.4l.1.1 9.1-9.1v-.2L4.3 2.4zM16.4 15.5l-3-3v-.2l3-3 .1.1 3.6 2c1 .6 1 1.5 0 2.1l-3.6 2zM16.5 15.5 13.4 12.4 4.2 21.5c.3.4.9.4 1.6 0l10.7-6M16.5 9.3 5.8 3.2c-.7-.4-1.3-.3-1.6 0l9.2 9.2z"/></svg>
      <span id="playTxt">Jogar no Google Play</span></a></div>
  </main>

  <footer>
    <div id="note"></div>
    <a href="../privacy-policy-pt" id="lnkPriv">Privacidade</a> · <a href="../terms-of-service-pt" id="lnkTerms">Termos</a> · Leacam © 2026
  </footer>
</div>

<script>
(() => {
  const T = {
    pt: { title:"Ranking Semanal", resets:"Vira em", updated:"Atualizado", ago:{m:"há {n} min",h:"há {n} h",d:"há {n} d",now:"agora há pouco"},
      eras:{1:"Sopa Primordial",2:"Ecossistema",3:"Civilização",4:"Multiverso"}, players:n=>n===1?"1 jogador":`${n} jogadores`,
      cats:{general:"Geral",evolution:"Evolução",discovery:"Descoberta",merge_master:"Merge Master",producer:"Maior Produtor",pollinator:"Maior Polinizador",
        predator:"Maior Predador",decomposer:"Maior Coletor",herbivore:"Maior Herbívoro",expedition:"Expedições",city:"Construtor de Cidades",ascension:"Ascensão",
        "producer.era3":"Maior Agricultor","pollinator.era3":"Maior Mercador","predator.era3":"Maior Bárbaro","decomposer.era3":"Maior Coletor","herbivore.era3":"Maior Consumidor",
        "producer.era4":"Maior Estrela","herbivore.era4":"Maior Satélite","pollinator.era4":"Maior Ressonante","predator.era4":"Maior Singularidade","decomposer.era4":"Maior Vestígio"},
      emptyT:"O topo está livre!", emptyP:e=>`Ninguém pontuou nesta categoria da era ${e} ainda nesta semana. O primeiro lugar pode ser seu.`,
      weekNow:"Esta semana", weekPrev:"Semana passada", prevTitle:"Pódio da Semana", final:"Placar final", range:(a,b)=>`${a} a ${b}`,
      emptyPrev:e=>`Ninguém pontuou nesta categoria da era ${e} na semana passada.`,
      play:"Jogar no Google Play", note:"Ranking semanal de verdade, direto do jogo. Toda virada de domingo para segunda, à meia-noite (Brasília), a disputa recomeça do zero.",
      priv:"Privacidade", terms:"Termos", privUrl:"../privacy-policy-pt", termsUrl:"../terms-of-service-pt", err:"Não deu pra carregar o ranking agora. Tente de novo em instantes.",
      place:["1º","2º","3º"] },
    en: { title:"Weekly Ranking", resets:"Resets in", updated:"Updated", ago:{m:"{n} min ago",h:"{n} h ago",d:"{n} d ago",now:"just now"},
      eras:{1:"Primordial Soup",2:"Ecosystem",3:"Civilization",4:"Multiverse"}, players:n=>n===1?"1 player":`${n} players`,
      cats:{general:"Overall",evolution:"Evolution",discovery:"Discovery",merge_master:"Merge Master",producer:"Top Producer",pollinator:"Top Pollinator",
        predator:"Top Predator",decomposer:"Top Decomposer",herbivore:"Top Herbivore",expedition:"Expeditions",city:"City Builder",ascension:"Ascension",
        "producer.era3":"Top Farmer","pollinator.era3":"Top Merchant","predator.era3":"Top Barbarian","decomposer.era3":"Top Gatherer","herbivore.era3":"Top Consumer",
        "producer.era4":"Biggest Star","herbivore.era4":"Biggest Satellite","pollinator.era4":"Biggest Resonant","predator.era4":"Biggest Singularity","decomposer.era4":"Biggest Remnant"},
      emptyT:"The top is wide open!", emptyP:e=>`No one has scored in this Era ${e} category yet this week. First place could be yours.`,
      weekNow:"This week", weekPrev:"Last week", prevTitle:"Weekly Podium", final:"Final standings", range:(a,b)=>`${a} – ${b}`,
      emptyPrev:e=>`No one scored in this Era ${e} category last week.`,
      play:"Play on Google Play", note:"A real weekly ranking, straight from the game. Every Monday 03:00 UTC the race starts over.",
      priv:"Privacy", terms:"Terms", privUrl:"../privacy-policy-en", termsUrl:"../terms-of-service-en", err:"Couldn't load the ranking right now. Try again in a moment.",
      place:["1st","2nd","3rd"] },
    es: { title:"Ranking Semanal", resets:"Reinicia en", updated:"Actualizado", ago:{m:"hace {n} min",h:"hace {n} h",d:"hace {n} d",now:"hace un momento"},
      eras:{1:"Sopa Primordial",2:"Ecosistema",3:"Civilización",4:"Multiverso"}, players:n=>n===1?"1 jugador":`${n} jugadores`,
      cats:{general:"General",evolution:"Evolución",discovery:"Descubrimiento",merge_master:"Merge Master",producer:"Mayor Productor",pollinator:"Mayor Polinizador",
        predator:"Mayor Depredador",decomposer:"Mayor Colector",herbivore:"Mayor Herbívoro",expedition:"Expediciones",city:"Constructor de Ciudades",ascension:"Ascensión",
        "producer.era3":"Mayor Agricultor","pollinator.era3":"Mayor Mercader","predator.era3":"Mayor Bárbaro","decomposer.era3":"Mayor Colector","herbivore.era3":"Mayor Consumidor",
        "producer.era4":"Mayor Estrella","herbivore.era4":"Mayor Satélite","pollinator.era4":"Mayor Resonante","predator.era4":"Mayor Singularidad","decomposer.era4":"Mayor Vestigio"},
      emptyT:"¡La cima está libre!", emptyP:e=>`Nadie ha puntuado en esta categoría de la era ${e} esta semana. El primer lugar puede ser tuyo.`,
      weekNow:"Esta semana", weekPrev:"Semana pasada", prevTitle:"Podio de la Semana", final:"Resultado final", range:(a,b)=>`${a} al ${b}`,
      emptyPrev:e=>`Nadie puntuó en esta categoría de la era ${e} la semana pasada.`,
      play:"Jugar en Google Play", note:"Ranking semanal real, directo del juego. Cada lunes a las 03:00 UTC la competencia vuelve a empezar.",
      priv:"Privacidad", terms:"Términos", privUrl:"../privacy-policy-en", termsUrl:"../terms-of-service-en", err:"No se pudo cargar el ranking. Inténtalo de nuevo en un momento.",
      place:["1º","2º","3º"] }
  };
  const LOCALE = {pt:"pt-BR",en:"en-US",es:"es-419"};
  const AV = ["#2f9e8f","#3f7fd9","#9a5ad9","#d9773f","#c9466e","#4aa84a","#d9a92b","#2bb5c9"];

  const qs = new URLSearchParams(location.search);
  const nav = (navigator.language||"pt").slice(0,2);
  let lang = qs.get("lang") || (T[nav] ? nav : "pt");
  let data = null, era = +(qs.get("era")||0), cat = qs.get("cat") || "general";
  // week=prev: placar final congelado da semana anterior (prev.json, gerado na virada a partir do arquivo do UGS).
  let week = qs.get("week") === "prev" ? "prev" : "now";
  const $ = id => document.getElementById(id);
  if (qs.get("shot") === "1") document.body.classList.add("shot");

  const catLabel = (c,e) => T[lang].cats[`${c}.era${e}`] || T[lang].cats[c] || c;
  const fmt = n => n.toLocaleString(LOCALE[lang]);
  const hash = s => [...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
  const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // Nomes longos (HandsomeDazzledPorcupine) quebram entre as palavras, não no meio delas.
  const nameHtml = s => esc(s).replace(/([a-z])([A-Z0-9])/g, "$1<wbr>$2");
  const playersIn = e => data ? Math.max(0, ...Object.values(data.eras[e]||{}).map(r=>r.length)) : 0;

  function langBar(){
    $("lang").innerHTML = Object.keys(T).map(l=>`<button class="${l===lang?"on":""}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
    $("lang").querySelectorAll("button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=LOCALE[lang];render();});
  }

  function render(){
    const t = T[lang];
    langBar();
    document.body.dataset.era = era;
    $("bg").style.backgroundImage = `url(img/era${era}_bg.webp)`;
    $("title").textContent = week === "prev" ? t.prevTitle : t.title;
    $("refresh").style.display = week === "prev" ? "none" : "";
    $("weeks").innerHTML = ["now","prev"].map(w=>`<button class="${w===week?"on":""}" data-w="${w}">${w==="now"?t.weekNow:t.weekPrev}</button>`).join("");
    $("weeks").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.dataset.w!==week){ week=b.dataset.w; load(true); } });
    $("playTxt").textContent = t.play; $("note").textContent = t.note;
    $("lnkPriv").textContent = t.priv; $("lnkPriv").href = t.privUrl;
    $("lnkTerms").textContent = t.terms; $("lnkTerms").href = t.termsUrl;
    tick();

    $("lenses").innerHTML = [1,2,3,4].map(e=>{
      const n = playersIn(e);
      return `<button class="lens ${e===era?"on":""}" data-e="${e}" aria-label="${t.eras[e]}">
        <div class="ring"><img src="img/era${e}_lens.webp" alt=""><div class="num">${e}</div></div>
        <span>${t.eras[e]}</span><div class="count">${n?t.players(n):""}</div></button>`;
    }).join("");
    $("lenses").querySelectorAll(".lens").forEach(b=>b.onclick=()=>{era=+b.dataset.e; if(!(data.eras[era]||{})[cat]) cat="general"; render();});

    const cats = Object.keys(data.eras[era]||{});
    $("cats").innerHTML = cats.map((c,i)=>`<button class="cat ${c===cat?"on":""} ${cats.length%2&&i===cats.length-1?"lone":""}" data-c="${c}">${catLabel(c,era)}</button>`).join("");
    $("cats").querySelectorAll(".cat").forEach(b=>b.onclick=()=>{cat=b.dataset.c;render();});

    const rows = (data.eras[era]||{})[cat] || [];
    if(!rows.length){
      $("board").innerHTML = `<div class="empty"><img src="img/podium.webp" alt=""><h3>${t.emptyT}</h3><p>${week==="prev"?t.emptyPrev(era):t.emptyP(era)}</p></div>`;
    } else {
      const medal = ["gold","silver","bronze"], order = [1,0,2];
      const pod = order.filter(i=>rows[i]).map(i=>{
        const r = rows[i];
        return `<div class="pod p${i+1}" style="grid-column:${order.indexOf(i)+1}">
          ${i===0?'<div class="crown">👑</div>':""}<img class="medal" src="img/medal_${medal[i]}.webp" alt="">
          <div class="nm">${nameHtml(r.name)}</div><div class="sc">${fmt(r.score)}</div><div class="rk">${t.place[i]}</div></div>`;
      }).join("");
      const rest = rows.slice(3).map((r,k)=>{
        const c = AV[hash(r.name)%AV.length];
        return `<div class="row" style="animation-delay:${Math.min(k,12)*25}ms"><div class="pos">${r.rank}</div>
          <div class="av" style="background:${c}">${esc(r.name[0].toUpperCase())}</div>
          <div class="nm">${nameHtml(r.name)}</div><div class="sc">${fmt(r.score)}</div></div>`;
      }).join("");
      $("board").innerHTML = `<div class="podium">${pod}</div>${rest?`<div class="list">${rest}</div>`:""}`;
    }
    const u = new URL(location); u.searchParams.set("era",era); u.searchParams.set("cat",cat);
    if (week === "prev") u.searchParams.set("week","prev"); else u.searchParams.delete("week");
    history.replaceState(null,"",u);
  }

  function tick(){
    if(!data) return;
    const t = T[lang];
    if (week === "prev") {
      const day = d => new Date(d).toLocaleDateString(LOCALE[lang], {day:"2-digit", month:"2-digit", timeZone:"America/Sao_Paulo"});
      $("clock").className = "final"; $("clock").textContent = t.final;
      $("updated").textContent = t.range(day(data.weekStart), day(new Date(data.weekEnd) - 6e4));
      return;
    }
    $("clock").className = "clock";
    let ms = new Date(data.weekEndsAt) - Date.now();
    if (ms < 0) ms = 0;
    const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4);
    $("clock").innerHTML = `${t.resets} <b>${d?d+"d ":""}${h}h ${String(m).padStart(2,"0")}m</b>`;
    const ago = (Date.now() - new Date(data.generatedAt))/6e4;
    const a = ago<5 ? t.ago.now : ago<60 ? t.ago.m.replace("{n}",Math.round(ago)) : ago<1440 ? t.ago.h.replace("{n}",Math.round(ago/60)) : t.ago.d.replace("{n}",Math.round(ago/1440));
    $("updated").textContent = `${t.updated} ${a}`;
  }

  // partículas do bioma
  const motes = $("motes");
  for(let i=0;i<18;i++){ const s=document.createElement("i");
    s.style.left = Math.random()*100+"vw"; s.style.animationDuration = 9+Math.random()*12+"s";
    s.style.animationDelay = -Math.random()*20+"s"; const z=2+Math.random()*5; s.style.width=s.style.height=z+"px"; motes.appendChild(s); }

  // Fonte AO VIVO: proxy (Google Apps Script) que lê os leaderboards do UGS com cache de ~1 min.
  // Vazio ou fora do ar → cai na foto estática data.json.
  const LIVE_URL = "https://script.google.com/macros/s/AKfycbz2QHr6SUB01xLCUrn98Rw88p25irkTuQyir2AUx1jnYjWzNqCS1n7JtgpPfj7rvh8XlA/exec";
  const REFRESH_MS = 60000;
  let loading = false;

  async function fetchData(){
    if (week === "prev") return (await fetch("prev.json?v=" + Date.now())).json();
    if (LIVE_URL){
      try{
        const r = await fetch(LIVE_URL + (LIVE_URL.includes("?")?"&":"?") + "t=" + Date.now());
        const j = await r.json();
        if (j && j.eras) return j;
      }catch(e){ /* cai na foto estática */ }
    }
    const r = await fetch("data.json?v=" + Date.now());
    return r.json();
  }

  async function load(manual){
    if (loading) return;
    loading = true; $("refresh").classList.add("spin");
    try{
      const j = await fetchData();
      const first = !data;
      data = j;
      if(!era || !data.eras[era]){ era = [1,2,3,4].reduce((b,e)=>playersIn(e)>playersIn(b)?e:b,1); }
      if(!(data.eras[era]||{})[cat]) cat = "general";
      document.body.classList.toggle("quiet", !first && !manual); // atualização automática sem re-animar
      render();
    }catch(e){
      if(!data){ langBar(); $("board").innerHTML = `<div class="empty"><img src="img/podium.webp" alt=""><p>${T[lang].err}</p></div>`; }
    }finally{
      loading = false;
      setTimeout(()=>$("refresh").classList.remove("spin"), 500);
    }
  }

  document.documentElement.lang = LOCALE[lang];
  $("refresh").onclick = () => load(true);
  load(false);
  setInterval(()=>{ if (week === "now") load(false); }, REFRESH_MS);   // semana passada não muda
  setInterval(tick, 15000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && week === "now") load(false); });
})();
</script>
</body>
</html>
